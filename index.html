<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>tiMe and space</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap');

:root {
--bg-color: #D9DFE3;
--text-color: #2C3539;
--border-color: #C0C8D0;
--btn-color: #5D6C7B;
--btn-hover: #4B5865;
--primary-color: #3498db;
--danger-color: #e74c3c;
}

* { box-sizing: border-box; }

body { font-family: 'Noto Sans JP', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 2vh 0; display: flex; justify-content: center; min-height: 100vh; }

.container { background-color: #ffffff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); width: 90%; max-width: 400px; margin: auto; }
.hidden { display: none !important; }
h1 { font-family: 'Josefin Sans', 'Noto Sans JP', sans-serif; text-align: center; font-size: 22px; font-weight: 500; margin-bottom: 20px; color: var(--text-color); letter-spacing: 1px; }

.guide-box { text-align: center; }
.guide-icon { font-size: 45px; margin-bottom: 10px; }
.guide-desc { font-size: 13px; color: var(--text-color); line-height: 1.6; margin-bottom: 25px; }
.guide-step { background-color: #FAF9F8; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px 15px; text-align: left; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
.os-title { font-weight: 500; color: var(--btn-color); margin-bottom: 15px; font-size: 15px; text-align: center; border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; letter-spacing: 1px; }
.step-list { padding-left: 0; margin: 0; list-style: none; counter-reset: step-counter; }
.step-list li { position: relative; padding-left: 32px; margin-bottom: 15px; font-size: 13.5px; line-height: 1.5; color: var(--text-color); }
.step-list li:last-child { margin-bottom: 0; }
.step-list li::before { content: counter(step-counter); counter-increment: step-counter; position: absolute; left: 0; top: 0; width: 22px; height: 22px; background-color: var(--btn-color); color: #fff; border-radius: 50%; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; }

.form-group { margin-bottom: 20px; }
label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }

/* 🌟 dateの幅崩れを修正: display:block と -webkit-appearance:none を追加 */
input[type="text"], input[type="email"], input[type="date"], select { 
    display: block;
    width: 100%; 
    padding: 12px 15px; 
    font-size: 16px; 
    font-family: 'Noto Sans JP', sans-serif; 
    border: 1px solid var(--border-color); 
    border-radius: 8px; 
    background-color: #FAF9F8; 
    color: var(--text-color); 
    transition: all 0.3s ease;
    -webkit-appearance: none;
    appearance: none;
}
input:focus, select:focus { outline: none; border-color: var(--btn-color); background-color: #ffffff; }

button { width: 100%; padding: 15px; font-size: 16px; font-weight: 500; letter-spacing: 2px; color: #fff; background-color: var(--btn-color); border: none; border-radius: 25px; cursor: pointer; margin-top: 10px; transition: background-color 0.3s ease; }
button:hover { background-color: var(--btn-hover); }
button:disabled { background-color: #ccc; cursor: not-allowed; }
.note { font-size: 13px; color: var(--text-color); text-align: center; margin-bottom: 15px; font-weight: 500; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }
.tab-bar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #ffffff; display: flex; justify-content: space-around; padding: 10px 0; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); border-top: 1px solid var(--border-color); z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
button.tab-btn { background-color: transparent; color: #a49e98; width: auto; padding: 5px 15px; margin: 0; border-radius: 0; font-size: 11px; letter-spacing: normal; display: flex; flex-direction: column; align-items: center; transition: color 0.3s ease; }
button.tab-btn.active { color: var(--btn-color); font-weight: bold; }
.tab-icon { font-size: 22px; margin-bottom: 4px; }
#app-content { padding-bottom: 80px; }
.welcome-box { text-align: center; margin-bottom: 25px; }
.welcome-box h2 { font-weight: 500; color: var(--text-color); margin-bottom: 5px; }
.info-card { background-color: #FAF9F8; border: 1px solid var(--border-color); border-radius: 12px; padding: 25px 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
.info-card h3 { font-size: 14px; color: var(--text-color); margin: 0 0 15px 0; font-weight: 500; }
#next-reservation { font-size: 18px; font-weight: bold; color: var(--btn-color); margin: 0; }

.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.4); z-index: 2000; display: flex; justify-content: center; align-items: center; }
.modal-content { background-color: #fff; padding: 25px 20px; border-radius: 12px; width: 85%; max-width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); text-align: center; }
#modal-title { margin: 0 0 15px 0; font-size: 16px; color: var(--btn-color); border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; }
#modal-body { font-size: 14px; color: var(--text-color); text-align: left; line-height: 1.6; white-space: pre-wrap; margin-bottom: 20px; }

.confirm-table { width: 100%; text-align: left; font-size: 14px; margin-bottom: 20px; border-collapse: collapse; }
.confirm-table th { padding: 8px 0; color: var(--text-muted); font-weight: normal; border-bottom: 1px solid #eee; white-space: nowrap; }
.confirm-table td { padding: 8px 0 8px 10px; font-weight: bold; border-bottom: 1px solid #eee; word-break: break-all; }
.modal-btn-group { display: flex; flex-direction: column; gap: 10px; }
.modal-btn-group button { margin: 0; padding: 12px; border-radius: 25px; font-size: 15px; font-weight: bold; }
.btn-submit { background: linear-gradient(135deg, #3498db, #2980b9); }
.btn-cancel { background-color: #FAF9F8; color: var(--text-muted); border: 1px solid var(--border-color); }

.checkin-container { text-align: center; margin: 30px auto; padding: 0 20px; }
.checkin-btn { background: linear-gradient(135deg, #4CAF50, #2E7D32); color: white; border: none; border-radius: 50px; padding: 16px 32px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); cursor: pointer; width: 100%; max-width: 300px; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 10px; }
.checkin-btn:disabled { background: #BDBDBD; box-shadow: none; transform: none; cursor: not-allowed; }
.checkin-msg { font-size: 14px; color: #d32f2f; margin-top: 10px; min-height: 20px; }
</style>
</head>
<body>

<div id="custom-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <button id="modal-close">閉じる</button>
  </div>
</div>

<div id="confirm-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3 id="modal-title" style="margin-bottom: 15px; font-size: 16px; color: var(--text-main); border-bottom: 1px dashed var(--border-color); padding-bottom: 10px;">入力内容の確認</h3>
    <table class="confirm-table">
      <tr><th>お名前</th><td id="conf-name"></td></tr>
      <tr><th>フリガナ</th><td id="conf-kana"></td></tr>
      <tr><th>生年月日</th><td id="conf-dob"></td></tr>
      <tr><th>メール</th><td id="conf-email"></td></tr>
    </table>
    <div class="modal-btn-group">
      <button id="confirm-submit-btn" class="btn-submit">送信する</button>
      <button id="confirm-cancel-btn" class="btn-cancel">修正する（閉じる）</button>
    </div>
  </div>
</div>

<div class="container">
<div id="install-guide" class="hidden">
  <div class="guide-box">
    <div class="guide-icon">📱</div>
    <h1>tiMe and space<br>メンバー登録</h1>
    <p class="guide-desc">こちらはアプリ専用のシステムです。<br>ホーム画面に追加してご利用ください。</p>
  </div>
</div>

<div id="app-content" class="hidden">
  <div id="tab-home" class="tab-panel active">
    <div class="welcome-box">
      <h2>こんにちは！</h2>
    </div>
    <div class="info-card">
      <h3>📅 ご予約日時</h3>
      <p id="next-reservation">確認中...</p>
    </div>
    <div class="checkin-container">
      <button id="checkin-btn" class="checkin-btn"><span class="icon">✅</span> お店にチェックイン</button>
      <p id="checkin-msg" class="checkin-msg"></p>
    </div>
  </div>

  <div id="tab-config" class="tab-panel">
    <h1>tiMe and space<br>メンバー登録</h1>
    
    <form id="registration-form">
      <div class="form-group">
        <label>お名前（フルネーム）</label>
        <input type="text" id="customer-name" placeholder="山田 太郎" required>
      </div>
      <div class="form-group">
        <label>フリガナ</label>
        <input type="text" id="customer-kana" placeholder="ヤマダ タロウ" required>
      </div>

      <div class="form-group">
        <label>生年月日</label>
        <input type="date" id="customer-dob" required>
      </div>

      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="customer-email" required>
      </div>

      <button type="submit" id="initial-submit-btn">確認画面へ進む</button>
    </form>
  </div>

  <nav class="tab-bar">
    <button type="button" class="tab-btn active" data-tab="tab-home"><span class="tab-icon">🏠</span><span class="tab-label">ホーム</span></button>
    <button type="button" class="tab-btn" data-tab="tab-config"><span class="tab-icon">⚙️</span><span class="tab-label">通知設定</span></button>
  </nav>
</div>
</div>

<script type="module" src="app.js?v=20260901"></script>
</body>
</html>
